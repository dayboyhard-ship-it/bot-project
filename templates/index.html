<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Notes</title>
    <!-- Подключаем Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">

            <h1 class="text-center mb-4">📝 Заметки с ИИ</h1>

            <!-- Форма добавления (Задача 3) -->
            <div class="card shadow-sm mb-4">
                <div class="card-body">
                    <form action="/" method="POST">
                        <div class="mb-3">
                            <label for="content" class="form-label">Ваша заметка:</label>
                            <textarea class="form-control" name="content" id="content" rows="3" placeholder="Напишите что-нибудь..." required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Сохранить и спросить ИИ</button>
                    </form>
                </div>
            </div>

            <!-- Список заметок (Задача 4) -->
            <h3 class="mb-3">История:</h3>
            {% for note in notes %}
                <div class="card shadow-sm mb-3">
                    <div class="card-body">
                        <p class="card-text fs-5">{{ note.content }}</p>

                        {% if note.ai_response %}
                            <div class="alert alert-info mt-2">
                                <strong>🤖 ИИ говорит:</strong> {{ note.ai_response }}
                            </div>
                        {% endif %}

                        <!-- Кнопка удаления (Задача 5) -->
                        <a href="/delete/{{ note.id }}" class="btn btn-sm btn-outline-danger">Удалить</a>
                    </div>
                </div>
            {% else %}
                <p class="text-muted text-center">Пока заметок нет. Добавьте первую!</p>
            {% endfor %}

        </div>
    </div>
</div>

</body>
</html>
