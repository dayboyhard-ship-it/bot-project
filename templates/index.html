<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <title>ToDo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  </head>
  <body class="p-4">
    <div class="container" style="max-width: 640px;">
      <h1 class="mb-4">📝 Список дел</h1>

      <form method="post" action="{{ url_for('add_task') }}" class="mb-3">
        <input name="content" class="form-control" placeholder="Введите задачу" autofocus>
        <button class="btn btn-primary mt-2">Добавить</button>
      </form>

      <ul class="list-group">
        {% for task in tasks %}
          <li class="list-group-item d-flex justify-content-between align-items-center">
            <span class="{% if task.done %}text-decoration-line-through text-muted{% endif %}">
              {{ task.content }}
            </span>
            <div>
              <a href="{{ url_for('toggle_task', task_id=task.id) }}"
                 class="btn btn-sm {% if task.done %}btn-secondary{% else %}btn-success{% endif %}">
                {% if task.done %}↩{% else %}✓{% endif %}
              </a>
              <a href="{{ url_for('delete_task', task_id=task.id) }}"
                 class="btn btn-danger btn-sm">✕</a>
            </div>
          </li>
        {% else %}
          <li class="list-group-item text-center text-muted">Задач пока нет</li>
        {% endfor %}
      </ul>
    </div>
  </body>
</html>
